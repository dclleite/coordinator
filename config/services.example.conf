# Copy to DATA/services/<name>.conf (DATA is .private/ by default) and adapt; parsed as key=value, never sourced.
# Commands run with bash -c inside DATA/services, with SERVICE_NAME and SERVICE_DIR set.
# The status command exits 0 and prints ok, degraded or down on its first line, then detail lines.
# A non-zero exit, no state word or a timeout (SERVICE_STATUS_TIMEOUT, default 10 s) reads unknown.
# Detail lines are shown, never stored: print counts and ages, not message text or people's ids.
# Ages in seconds read best as "<n>s ago" and "every <n>s"; the panel turns them into minutes and hours.
# When degraded, a detail line with the word stalled, failing or error puts the service under "Needs you".
scope=personal
status=./acme-sync-status.sh
# Class auto runs on request; class confirm only with --confirmed, after the developer's word.
# Anything that posts to people or writes to a tracker is not wired here at all.
verb.status=auto:./acme-sync-status.sh
verb.restart=confirm:systemctl --user restart acme-sync
verb.stop=confirm:systemctl --user stop acme-sync
# What a verb's button says; without a label line the button says "Run <verb>". A label line is never a verb.
verb.restart.label=Restart the sync
verb.stop.label=Stop the sync
# Threads of the agent runtime that belong to the service, so status and cleanup treat them as its own.
threads=thr_acme_sync_1,thr_acme_sync_2
# Folders cleanup must never touch; a trailing * matches every path that starts with the prefix.
protect=~/src/acme-sync/.claude/worktrees/acme-prod,~/src/acme-sync/cache-*
panel=http://127.0.0.1:9999/
