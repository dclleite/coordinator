# Read by panel.sh, never sourced. Port and refresh are whole numbers; PANEL_IDLE_MIN may have a decimal part.
PANEL_PORT_FROM=8765
PANEL_IDLE_MIN=30
PANEL_REFRESH_SEC=10
# auto follows the browser's languages (a table in panel/locales/, else English), or name one: PANEL_LANG=pt-BR.
# A person's own choice goes in .private/config/panel.conf, which overrides this file key by key.
PANEL_LANG=auto
