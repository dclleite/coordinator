# Sourced by health.sh, sweep.sh, reap.sh and browser.sh. Whole numbers only.
MIN_FREE_DISK_GB=15
MIN_FREE_MEM_PCT=20
MAX_RUNNING_CONTAINERS=12
STALE_AGENT_MIN=120
# Seconds a resource command may take before it reads unknown.
RES_TIMEOUT_SEC=10
# reap.sh: a browser no open task owns is stopped after this many hours.
REAP_BROWSER_MAX_HOURS=6
REAP_TMP_MAX_DAYS=2
REAP_INTERVAL_MIN=10
BROWSER_TOOL=${BROWSER_TOOL:-dev-browser}
BROWSER_HOME=${BROWSER_HOME:-$HOME/.dev-browser}
# Seconds the container engine may take to answer; past it containers read unknown and stop nothing.
CONTAINER_TIMEOUT_SEC=3
